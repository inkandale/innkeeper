{{- $env := list
  (dict "name" "INNKEEPER_DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" (required "database.secretName is required" .Values.database.secretName) "key" .Values.database.key)))
  (dict "name" "INNKEEPER_SECRETS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" (required "secretsKey.secretName is required" .Values.secretsKey.secretName) "key" .Values.secretsKey.key)))
  (dict "name" "INNKEEPER_PUBLIC_URL" "value" .Values.publicUrl)
  (dict "name" "INNKEEPER_WORKER_CONCURRENCY" "value" (toString .Values.worker.concurrency))
}}
{{- if .Values.backup.persistence.enabled }}
{{- $env = append $env (dict "name" "INNKEEPER_BACKUP_DIR" "value" "/backups") }}
{{- end }}
{{- range $type := list "assets" "config" }}
{{- $b := index $.Values.backup $type }}
{{- if $b.every }}
{{- if not $.Values.backup.persistence.enabled }}
{{- fail (printf "backup.%s.every needs backup.persistence.enabled=true" $type) }}
{{- end }}
{{- $env = append $env (dict "name" (printf "INNKEEPER_BACKUP_%s_EVERY" ($type | upper)) "value" $b.every) }}
{{- $env = append $env (dict "name" (printf "INNKEEPER_BACKUP_%s_KEEP" ($type | upper)) "value" (toString $b.keep)) }}
{{- end }}
{{- end }}
{{- $env = concat $env .Values.extraEnv }}
{{- $blobs := .Values.persistence.blobs.enabled }}
{{- if not $blobs }}
{{- $names := list }}
{{- range $env }}{{ $names = append $names .name }}{{ end }}
{{- if not (has "INNKEEPER_BLOB_DIR" $names) }}
{{- fail "persistence.blobs.enabled=false needs INNKEEPER_BLOB_DIR in extraEnv" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "innkeeper.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The volumes are ReadWriteOncePod, so the old pod must stop first.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "innkeeper.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "innkeeper.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range $cmd := list "api" "worker" }}
        - name: {{ $cmd }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $cmd }}]
          {{- if and (eq $cmd "worker") $.Values.worker.metrics.enabled }}
          env: {{- toYaml (append $env (dict "name" "INNKEEPER_METRICS_LISTEN" "value" ":9090")) | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9090
          {{- else }}
          env: {{- toYaml $env | nindent 12 }}
          {{- end }}
          {{- if eq $cmd "api" }}
          ports:
            - name: http
              containerPort: 8080
          # The port opens once migrations finish; this gives them up to 30 minutes before liveness counts.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          {{- end }}
          resources: {{- toYaml (index $.Values.resources $cmd) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            {{- if $blobs }}
            - name: blobs
              mountPath: /data/blobs
            {{- end }}
            - name: plugins
              mountPath: /data/plugins
            - name: tmp
              mountPath: /tmp
            {{- if $.Values.backup.persistence.enabled }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      volumes:
        {{- if $blobs }}
        - name: blobs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-blobs
        {{- end }}
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-plugins
        - name: tmp
          emptyDir: {}
        {{- if .Values.backup.persistence.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-backups
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

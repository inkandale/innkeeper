# Innkeeper with PostgreSQL: the API, on http://localhost:8080 (INNKEEPER_PORT
# changes it), and the worker, in one container. In a checkout,
# compose.override.yaml builds the local source instead.
# See "Docker Compose" in docs/running.md.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: innkeeper
      POSTGRES_PASSWORD: innkeeper
      POSTGRES_DB: innkeeper
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, since the init-time server listens only on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "innkeeper", "-d", "innkeeper"]
      interval: 2s
      retries: 30

  api:
    image: ghcr.io/inkandale/innkeeper:1.0.0 # x-release-please-version
    command: ["serve"]
    environment:
      INNKEEPER_DATABASE_URL: postgres://innkeeper:innkeeper@db:5432/innkeeper?sslmode=disable
      # Unset, the first start creates /data/secrets.key.
      INNKEEPER_SECRETS_KEY: ${INNKEEPER_SECRETS_KEY:-}
      # Plain http for local testing, so browsers keep the session cookie.
      INNKEEPER_PUBLIC_URL: http://localhost:${INNKEEPER_PORT:-8080}
      # Claims a new server without the setup code; see "First login" in docs/running.md.
      # INNKEEPER_OWNER_PASSWORD_HASH: ${INNKEEPER_OWNER_PASSWORD_HASH}
      # Scheduled backups; see "Backup and restore" in docs/running.md. On Linux the
      # host folder must be writable by uid 10001.
      # INNKEEPER_BACKUP_DIR: /backups
      # INNKEEPER_BACKUP_ASSETS_EVERY: 24h
      # INNKEEPER_BACKUP_ASSETS_KEEP: 7
      # INNKEEPER_BACKUP_CONFIG_EVERY: 7d
      # INNKEEPER_BACKUP_CONFIG_KEEP: 7
    volumes:
      - data:/data
      # Folder imports read from here; see "Importing" in docs/using.md.
      - ${INNKEEPER_IMPORT_DIR:-./import}:/import:ro
      # - ./backups:/backups
    ports:
      - "127.0.0.1:${INNKEEPER_PORT:-8080}:8080"
    # Lets plugins reach apps on this machine at host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  data:

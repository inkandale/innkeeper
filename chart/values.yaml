image:
  repository: ghcr.io/inkandale/innkeeper
  # Empty runs the release matching the chart's appVersion. `latest` follows develop.
  tag: ""
  pullPolicy: IfNotPresent

# Existing Secrets the chart reads; it creates none.
database:
  # A postgres:// URL. PostgreSQL 15 or later with pgvector. Migrations run
  # CREATE EXTENSION vector, which needs a superuser unless an admin ran it first.
  secretName: ""
  key: uri
secretsKey:
  # 32 random bytes, base64. Losing it loses every stored plugin secret.
  secretName: ""
  key: INNKEEPER_SECRETS_KEY

# Where browsers reach the API, such as https://innkeeper.example.com.
publicUrl: ""

worker:
  concurrency: 4
  # Serves job metrics at /metrics on port 9090 of the worker container and
  # adds a PodMonitor, which needs the Prometheus Operator CRDs.
  metrics:
    enabled: false

# Blob store, shared by the API and worker containers.
persistence:
  blobs:
    # false mounts no blob volume, for a store elsewhere: mount it with
    # extraVolumes and extraVolumeMounts, and set INNKEEPER_BLOB_DIR in extraEnv.
    # On an existing release, false deletes the blobs PVC and its blobs: copy
    # the blob directory to the new location first.
    enabled: true
  size: 5Gi
  storageClass: ""
  accessModes: [ReadWriteOncePod]
  # Installed plugins, shared by the API and worker containers.
  plugins:
    size: 1Gi

# Scheduled backups; see "Backup and restore" in docs/running.md. An empty
# `every` turns that type's schedule off.
backup:
  assets:
    every: ""
    keep: 7
  config:
    every: ""
    keep: 7
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOncePod]

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""

service:
  port: 8080

resources:
  api: {}
  worker: {}

# Added to both containers.
extraEnv: []
# Mounted in both containers, such as a folder an import plugin reads.
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
nodeSelector: {}
tolerations: []

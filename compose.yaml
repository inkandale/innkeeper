# Local test stack: PostgreSQL, the API on http://localhost:8080 (INNKEEPER_PORT
# changes it), and the worker.
# See "Try it with Docker Compose" in README.md.

x-innkeeper: &innkeeper
  build:
    context: .
  image: innkeeper:dev
  environment:
    INNKEEPER_DATABASE_URL: postgres://innkeeper:innkeeper@db:5432/innkeeper?sslmode=disable
    INNKEEPER_SECRETS_KEY: ${INNKEEPER_SECRETS_KEY:?set INNKEEPER_SECRETS_KEY in .env; see README.md}
    # Plain http for local testing, so browsers keep the session cookie.
    INNKEEPER_PUBLIC_URL: http://localhost:${INNKEEPER_PORT:-8080}
    # Scheduled backups; see "Backup and restore" in README.md. Both services
    # mount the folder; on Linux the host folder must be writable by uid 10001.
    # INNKEEPER_BACKUP_DIR: /backups
    # INNKEEPER_BACKUP_ASSETS_EVERY: 24h
    # INNKEEPER_BACKUP_ASSETS_KEEP: 7
    # INNKEEPER_BACKUP_CONFIG_EVERY: 7d
    # INNKEEPER_BACKUP_CONFIG_KEEP: 7
  volumes:
    - data:/data
    # Folder imports read from here; see "Importing" in README.md.
    - ${INNKEEPER_IMPORT_DIR:-./import}:/import:ro
    # - ./backups:/backups
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: innkeeper
      POSTGRES_PASSWORD: innkeeper
      POSTGRES_DB: innkeeper
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "innkeeper", "-d", "innkeeper"]
      interval: 2s
      retries: 30

  api:
    <<: *innkeeper
    command: ["api"]
    ports:
      - "127.0.0.1:${INNKEEPER_PORT:-8080}:8080"

  worker:
    <<: *innkeeper
    command: ["worker"]

volumes:
  pgdata:
  data:

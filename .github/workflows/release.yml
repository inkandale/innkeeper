name: release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main

  # Runs here rather than on the tag: a tag pushed with GITHUB_TOKEN starts no workflows.
  # develop builds :latest; main builds only a release.
  image:
    needs: [ci, release-please]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (github.ref == 'refs/heads/develop' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release builds the Dockerfile's pinned plugins; develop builds main's
      # newest commit, by hash so the layer cache can't reuse an older clone.
      - id: plugins
        run: |
          if [ "$GITHUB_REF" = refs/heads/develop ]; then
            ref=$(git ls-remote https://github.com/inkandale/innkeeper-plugins.git refs/heads/main | cut -f1)
          else
            ref=$(sed -n 's/^ARG PLUGINS_REF=//p' Dockerfile)
          fi
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            io.github.inkandale.innkeeper.plugins-ref=${{ steps.plugins.outputs.ref }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.created == 'true' }}
      - id: version
        run: echo "version=${RELEASE:-develop-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE: ${{ needs.release-please.outputs.created == 'true' && needs.release-please.outputs.version || '' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            PLUGINS_REF=${{ steps.plugins.outputs.ref }}
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The chart and compose.yaml name the release's image, so they wait for it.
  chart:
    needs: [release-please, image]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
      - run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm package chart
          helm push innkeeper-*.tgz "oci://ghcr.io/$OWNER/charts"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}

  ink:
    needs: [release-please, image]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o "dist/ink_${VERSION}_${os}_${arch}${ext}" ./cmd/ink
          done
          cp compose.yaml dist/
          (cd dist && sha256sum -- * > checksums.txt)
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
